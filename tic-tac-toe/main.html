<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <title>Document</title>
</head>
<body>
  <main>
    <section>
      <div>
        <button command="show-modal" commandfor="dialog" class="pop-dialog">Create player</button>
        <button type="button" class="replay">Restart</button>
        <button type="button" class="reset">Reset</button>
      </div>
      <dialog id="dialog">
        <button class="close" command="close" commandfor="dialog">✖️</button>
        <div>
          <input type="text" name="player1" id="player1" placeholder="player 1 name">
          <input type="text" name="player2" id="player2" placeholder="player 2 name">
          <button type="button" class="pop-dialog" command="close" commandfor="dialog" id="begin-game">Begin</button>
        </div>
      </dialog>
      <p class="player-display" style="text-align: center; margin-top: 20px;"></p>
      <div class="main-vue">
        <div class="player-set">
          <hr>
          <div class="player-info">
            <h3>Player One:</h3>
            <div class="player-one-symbol"  style="text-align: center; font-size: 4rem;">X</div>
            <span class="player-name one">Dedddy</span>
          </div>
          <div>
            <hr>
            <span class="one-victories score">Victories: </span>
          </div>
        </div>
        <div class="container"></div>
        <div class="player-set">
          <hr>
          <div class="player-info">
            <h3>Player Two:</h3>
            <div class="player-two-symbol" style="text-align: center; font-size: 4rem;">X</div>
            <span class="player-name two">Dedddy</span>
          </div>
          <div>
            <hr>
            <span class="two-victories score">Victories: </span>
          </div>
        </div>
        <p class="tie-vue">Tie: </p>
      </div>
    </section>
  </main>
</body>
</html>
