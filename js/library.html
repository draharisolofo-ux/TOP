<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="library.css">
  <script src="library.js" defer></script>
  <title>Document</title>
</head>
<body>
  <main>
    <form action="">
      <div>
        <label for="title">Title</label>
        <input type="text" name="title" id="title" placeholder="title" required minlength="3">
      </div>
      <div>
        <label for="author">Author</label>
        <input type="text" name="author" id="author" placeholder="Author" minlength="3" required>
      </div>
      <div>
        <label for="pages">Pages</label>
        <input type="number" name="pages" id="pages" min="0" required>
      </div>
      <div>
        <label for="read">Have you read the book?</label>
        <select name="read" id="read">
          <option value="">---</option>
          <option value="true">Already read</option>
          <option value="">Not yet</option>
        </select>
      </div>
      <button type="submit" class="btn-add">Add Book</button>
    </form>
    <table>
      <thead>
        <th>ID</th>
        <th>TITLE</th>
        <th>AUTHOR</th>
        <th>PAGES</th>
        <th>READ</th>
        <th>ACTION</th>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</body>
</html>
